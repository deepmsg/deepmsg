[package]
name = "deepmsg-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# A workspace of its own: the root workspace's members do not include this
# directory, so `cargo build/test --workspace` never sees `libfuzzer-sys`.
[workspace]

[dependencies]
arbitrary = { version = "=1.4.2", features = ["derive"] }
libfuzzer-sys = "0.4"

deepmsg-core = { path = "../crates/core" }
deepmsg-cnc = { path = "../crates/cnc" }
deepmsg-codec = { path = "../crates/codec" }
deepmsg-client = { path = "../crates/client", features = ["fuzz-hooks"] }
deepmsg-driver = { path = "../crates/driver" }
deepmsg-archive = { path = "../crates/archive" }
deepmsg-cluster-common = { path = "../crates/cluster/common" }
deepmsg-codec-cluster-mark = { path = "../crates/codec/cluster-mark" }
deepmsg-cluster = { path = "../crates/cluster/consensus" }

[[bin]]
name = "01_channel_uri"
path = "fuzz_targets/01_channel_uri.rs"
test = false
doc = false
bench = false

[[bin]]
name = "02_logbuffer_scan"
path = "fuzz_targets/02_logbuffer_scan.rs"
test = false
doc = false
bench = false

