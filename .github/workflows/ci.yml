name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain and CI's components
        # rust-toolchain.toml pins the channel and `cargo` resolves to it, so
        # rustfmt and clippy have to be installed *for that channel*. Installing
        # components on the default stable toolchain instead is what made every
        # run fail with "'cargo-fmt' is not installed for the toolchain '1.95.0'".
        # Reading the channel from the file keeps the version in one place.
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --component rustfmt --component clippy --no-self-update
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
