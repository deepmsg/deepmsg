name: fuzz

# The fuzz suite is a workspace of its own (`fuzz/Cargo.toml`), so the `ci`
# workflow's `cargo test --workspace` does not reach it. Two tiers here:
#
# - `gate`: on a pull request. Stable toolchain, seconds: formatting, the
#   frozen crash bytes, and that every target compiles.
# - `smoke`: nightly, on a schedule or by hand. One minute per target under
#   libFuzzer + the sanitizer; a crash fails the job and uploads its artifact.

on:
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain and rustfmt
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --component rustfmt --no-self-update
      - name: Format, regressions and compilation
        run: |
          cd fuzz
          cargo fmt --check
          cargo test
          cargo check --bins

  smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Seed the corpora
        run: ./fuzz/corpus_seed/seed_from_fixtures.sh
      - name: Every target, sixty seconds
        run: |
          cd fuzz
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" "corpus/$target" -- \
              -max_total_time=60 -timeout=2 -rss_limit_mb=2048 || exit 1
            echo "::endgroup::"
          done
      - name: Keep what crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
