[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cnc",
    "crates/codec",
    "crates/codec-archive",
    "crates/codec-archive-mark",
    "crates/codec-cluster",
    "crates/codec-cluster-mark",
    "crates/codec-cluster-node-state",
    "crates/client",
    "crates/driver",
    "crates/archive",
    "crates/tools",
    "crates/bench",
    "examples",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

# Workspace lint baseline (see docs/adr/0002-unsafe-policy.md).
# `unsafe_code` is deliberately NOT set here: the crates that own the unsafe
# boundary (deepmsg-core, deepmsg-cnc, and the driver's syscall shim) permit
# it locally; every other crate forbids it at crate level.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# The load test rig is built with more than the default release profile, and
# these are the settings that can be given per package. `lto` and `panic` cannot
# — cargo refuses to parse them here — so they come from the build invocation
# instead; see `analysis/bench/build-rig.sh`.
#
# The rig is the measuring instrument *and* half of what R3/R4 measure, so its
# own overhead lands in the numbers: a monomorphised call chain is worth having.
# The driver and every other crate keep the default profile, so nothing that has
# already been measured moves.
[profile.release.package.deepmsg-bench]
opt-level = 3
codegen-units = 1
strip = true
