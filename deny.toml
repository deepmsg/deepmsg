# cargo-deny policy. The workspace gained its first third-party dependency with
# P0-a (`libc`, for the memory-mapping seam in `deepmsg-core::pal`); this file
# is what decides whether any further one is acceptable.

[licenses]
allow = ["Apache-2.0", "MIT", "ISC", "BSD-3-Clause", "Zlib", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
