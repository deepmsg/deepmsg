extensions:
  # The three places this must appear: here, the filelog receiver's `storage`
  # and both exporters' `sending_queue.storage`. Without all three, a restart
  # of the collector loses the lines written while it was down.
  file_storage:
    directory: ${env:DEEPMSG_OBS_STATE_DIR}
    create_directory: true

receivers:
  filelog:
    include: ["${env:DEEPMSG_LOG_DIR}/*.json"]
    # `start_at` governs the files present at the collector's *first* start:
    # `beginning` reads the backlog the applications have already written;
    # `end` silently skips it (measured: 3 pre-existing lines, 0 vs 3). Once a
    # persisted state exists, offsets govern, and a rotation that happens while
    # the collector is down is read from the beginning under either value
    # (measured). The cost of `beginning` is one bounded read of what the
    # writer keeps on disk.
    start_at: beginning
    storage: file_storage
    operators:
      - type: json_parser
        parse_from: body
        timestamp:
          parse_from: attributes.ts
          # RFC3339Nano is a Go layout name, not a strptime one: a strptime
          # layout here fails silently and the timestamp becomes "now".
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z07:00'
        severity:
          # Without this the level stays an attribute and severity_text is empty.
          parse_from: attributes.level
      # The line is one JSON object; the useful message is its `msg`. An event
      # that has none (the driver's lifecycle events) is named by its `event`,
      # and `copy` leaves `event` queryable as an ordinary field.
      - type: copy
        if: attributes.msg == nil
        from: attributes.event
        to: body
      - type: move
        if: attributes.msg != nil
        from: attributes.msg
        to: body

  prometheus:
    config:
      scrape_configs:
        - job_name: deepmsg-counters
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:DEEPMSG_COUNTERS_ENDPOINT}"]
        - job_name: deepmsg-otelcol
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:DEEPMSG_OTELCOL_TELEMETRY_ENDPOINT}"]

  hostmetrics:
    collection_interval: 30s
    # On a host this is `/`; the DaemonSet mounts the host tree at /hostfs and
    # sets the variable to it, so both forms share one config.
    root_path: ${env:DEEPMSG_HOSTMETRICS_ROOT}
    scrapers:
      cpu: {}
      memory: {}
      disk: {}
      filesystem: {}
      network: {}

processors:
  # First in the pipeline: the collector is a guest on the media driver's host.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  # The log lines carry their own node_id, but the host and collector metrics
  # have none; without this a dashboard cannot tell two nodes apart, and the
  # disk alert would be cluster-wide.
  resource/node_id:
    attributes:
      - key: node_id
        value: ${env:DEEPMSG_NODE_ID}
        action: upsert
  # ...and the resource alone is not enough: the remote-write exporter keeps
  # resource attributes on the resource (they would only show up in
  # `target_info`), so a sample from two hosts with the same target stays one
  # series, and VictoriaMetrics drops all but one of them as "same timestamp,
  # different value". This copies the identity onto every data point.
  transform/node_id:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["node_id"], resource.attributes["node_id"])
  batch:
    timeout: 5s

exporters:
  otlphttp/victorialogs:
    logs_endpoint: ${env:DEEPMSG_VL_LOGS_ENDPOINT}
    headers:
      # The stream identifies where a line came from; level and event are
      # query fields. A role or level in here splits the timeline.
      VL-Stream-Fields: "component,node_id"
      Authorization: "Bearer ${env:DEEPMSG_OBS_WRITE_TOKEN}"
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 10000
      num_consumers: 4
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s

  prometheusremotewrite/victoriametrics:
    endpoint: ${env:DEEPMSG_VM_WRITE_ENDPOINT}
    headers:
      Authorization: "Bearer ${env:DEEPMSG_OBS_WRITE_TOKEN}"
    sending_queue:
      enabled: true
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s

service:
  extensions: [file_storage]
  telemetry:
    metrics:
      # normal, not basic: the per-component otelcol_exporter_* metrics (the
      # P3 alert's source) are emitted only at normal and above.
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  pipelines:
    logs:
      receivers: [filelog]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/victorialogs]
    metrics:
      receivers: [prometheus, hostmetrics]
      processors: [memory_limiter, resource/node_id, transform/node_id, batch]
      exporters: [prometheusremotewrite/victoriametrics]
