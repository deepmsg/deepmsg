# Grafana provisioning: VictoriaMetrics through vmauth.
#
# The URL is vmauth on the log host, expanded from `DEEPMSG_VMAUTH_URL`: the
# single profile leaves it at the loopback, and the cluster profile sets it to
# the log host's private address, which is where vmauth must listen for the
# agents on the media hosts. The token is expanded from the unit's environment
# (`DEEPMSG_GRAFANA_READ_TOKEN`); no literal credential is in the tree, and the
# token is the read-only one, not the agent's write token.
apiVersion: 1

datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: $__env{DEEPMSG_VMAUTH_URL}
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: "Bearer $__env{DEEPMSG_GRAFANA_READ_TOKEN}"
