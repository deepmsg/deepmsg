# /etc/deepmsg/grafana.ini — the datasources, dashboards and alert rules are
# provisioned from /etc/deepmsg/grafana/provisioning (read-only files).
#
# The admin password comes from GF_SECURITY_ADMIN_PASSWORD in the unit's
# EnvironmentFile. It is deliberately not here, and Grafana reads it only on
# the first start (a later change needs `grafana-cli admin reset-admin-password`).

[server]
http_addr = 127.0.0.1
http_port = 3000
domain = localhost
root_url = http://127.0.0.1:3000/

[security]
admin_user = admin

[auth]
disable_login_form = false

[auth.anonymous]
enabled = false

[paths]
provisioning = /etc/deepmsg/grafana/provisioning

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console
level = warn
