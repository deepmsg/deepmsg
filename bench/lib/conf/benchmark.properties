# The driver settings a run under `bench/` uses, on top of the reference's own
# `low-latency-driver.properties`, which is handed over untouched.
#
# The first three lines are *alignment*, not tuning: three throughput knobs that
# this build has no setting for are pinned to what it hard-codes, so that a cell
# that swaps only the driver compares two drivers rather than two
# configurations. `bench/rust-vs-java/run-batch.sh` states the same three in the
# table it prints, because a cell run on the aligned values may not be read
# beside one that is not.
#
# The rest is the bench machine's own file, read from the run that produced the
# current baselines.
aeron.network.publication.max.messages.per.send=4
aeron.receiver.io.vector.capacity=16
aeron.sender.io.vector.capacity=4

aeron.dir=/dev/shm/aeron
aeron.file.page.size=4k
aeron.term.buffer.sparse.file=true
aeron.pre.touch.mapped.memory=false
aeron.conductor.cpu.affinity=1
aeron.sender.cpu.affinity=2
aeron.receiver.cpu.affinity=3
aeron.mtu.length=1408
aeron.ipc.mtu.length=1408
aeron.socket.so_sndbuf=2m
aeron.socket.so_rcvbuf=2m
aeron.rcv.initial.window.length=2m
