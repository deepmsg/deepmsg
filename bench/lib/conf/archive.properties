# The archive settings a batch under `bench/archive-vs-java/` uses.
#
# Eleven of these are the reference's own `scripts/aeron/low-latency-archive.properties`,
# copied verbatim, because the `J` arm is the reference archive launched from its own
# scripts: whatever this file says, that arm is what the reference's benchmarks run.
# The other two the run **gives on the command line**, because they are the axes a batch
# sweeps rather than values it holds — both are named at the bottom.
#
# # Why every line is a claim, and what it claims
#
# A cell that swaps the archive may only be read beside another cell if the two were run
# on the same values. That is the same rule `lib/conf/benchmark.properties` states for the
# driver's three throughput knobs, and it is why each name below carries what this build
# does with it: **照做** (honoured), **收下不照做** (accepted, not honoured) or **拒绝**
# (refused by name). The classification goes into the cell's label, so that a reader can
# see which cells are comparable without opening this file.
#
# **As of P2-13 the answer is 13/13 照做.** Two of them were not, and both were fixed
# rather than excused:
#
#   * `aeron.archive.catalog.file.sync.level` was accepted and ignored until **P2-12**
#     (`crates/archive/src/catalog.rs` counted zero `sync_all`/`sync_data` calls). That
#     was the most expensive asymmetry in the whole table: the reference's two
#     `file-sync-level 0/2` rows feed **the same `${fsync}`** to this name and to
#     `aeron.archive.file.sync.level` (`remote-live-replay-benchmarks`), so the `J` arm at
#     `fsync=2` was paying for a catalog force the `R-attach` arm never made — and the
#     question "what does durability cost" could not be asked of both.
#   * `aeron.archive.recording.events.enabled` was **refused by name** until **P2-13**
#     (a client waiting for events that never came). It is the reference's live-recording
#     harness's pacemaker, so the `S1` scenario could not run at all without it.
#
# # The two the command line gives
#
#   aeron.archive.catalog.file.sync.level=${fsync}   # 0 or 2, the batch's axis
#   aeron.archive.recording.events.enabled=true      # the events the live-recording
#                                                    # harness paces itself on
#
# ★ **Turning the events on obliges a channel, for both arms.** The reference's own
# `Archive.Context.conclude` refuses `enabled` with no channel (`Archive.java:1240-1245`),
# and this build refuses it in the same words, so the batch must pass
# `aeron.archive.recording.events.channel` (`aeron:ipc`, the shape the reference's own
# `live-recording-client:27` uses) or the `R-attach` arm will not start while `J` does.
aeron.archive.dir.delete.on.start=true
aeron.archive.threading.mode=DEDICATED
aeron.archive.control.term.buffer.sparse=true
aeron.archive.file.sync.level=0
aeron.archive.file.io.max.length=1m
aeron.archive.idle.strategy=spin
aeron.archive.recorder.idle.strategy=noop
aeron.archive.replayer.idle.strategy=noop
aeron.archive.conductor.cycle.threshold=1ms
aeron.archive.recorder.cycle.threshold=1ms
aeron.archive.replayer.cycle.threshold=1ms
