[package]
name = "deepmsg-tests"
description = "Cross-crate integration and interop tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Tests that require the reference C driver from the Aeron 1.53.2 checkout
# (see docs/reference.md for the expected sibling-directory layout).
interop = []

[dependencies]
deepmsg-core = { path = "../crates/core" }
deepmsg-client = { path = "../crates/client" }
deepmsg-driver = { path = "../crates/driver" }
deepmsg-cnc = { path = "../crates/cnc" }

[[test]]
name = "basic_roundtrip"
path = "integration/basic_roundtrip.rs"

[[test]]
name = "termination_handshake"
path = "integration/termination_handshake.rs"

# Runs in CI, unlike `c_driver_basic`: it needs only a committed capture of a
# real driver's CnC header, not the reference checkout.
[[test]]
name = "cnc_fixture"
path = "integration/cnc_fixture.rs"

# The writer's side of the same contract `cnc_fixture` reads: a file this
# build creates, compared byte for byte with a real driver's.
[[test]]
name = "cnc_create"
path = "integration/cnc_create.rs"

# The termination preconditions, against synthetic CnC files. No driver needed,
# so unlike `c_driver_basic` this one runs in CI.
[[test]]
name = "cnc_terminate"
path = "integration/cnc_terminate.rs"

# The client's matching loop against fabricated replies. Runs in CI, which the
# interop suite cannot.
[[test]]
name = "client_round_trip"
path = "integration/client_round_trip.rs"

# The wait a client owes a driver that is still creating its file — the window
# that made a client started alongside a driver fail deterministically.
# A UDP stream that crosses a term boundary, where the term's tail is a padding
# frame sent as its header alone. Runs in CI: it needs our own driver, not the
# reference's.
[[test]]
name = "udp_term_boundary"
path = "integration/udp_term_boundary.rs"

[[test]]
name = "connect_window"
path = "integration/connect_window.rs"

# What the directory discipline does with a CnC file whose version this build
# may not read: refuse it, never delete it.
[[test]]
name = "dir_liveness"
path = "integration/dir_liveness.rs"

[[test]]
name = "c_driver_basic"
path = "interop/c_driver_basic.rs"
required-features = ["interop"]

# The two-sided termination oracle: refused by default, accepted when the
# driver is started with an allowing validator.
[[test]]
name = "c_driver_terminate"
path = "interop/c_driver_terminate.rs"
required-features = ["interop"]

# The command/response loop: add a subscription, match its ready response, and
# prove the keepalive keeps the client alive.
[[test]]
name = "c_driver_client"
path = "interop/c_driver_client.rs"
required-features = ["interop"]

# P0's acceptance test: an IPC payload written by one client and read by
# another, through a log buffer the driver created and both processes mapped.
[[test]]
name = "c_driver_pubsub"
path = "interop/c_driver_pubsub.rs"
required-features = ["interop"]

# The other direction: the reference's own counter viewer reading a file
# *this* build wrote. Needs the reference build for `AeronStat`, not for a
# driver.
[[test]]
name = "aeron_stat_counters"
path = "interop/aeron_stat_counters.rs"
required-features = ["interop"]

# The other direction of the pair above: the reference's own client samples
# against a driver *this* build wrote. Needs the reference build for the
# samples, and our own driver binary for the driver.
[[test]]
name = "own_driver_reference_client"
path = "interop/own_driver_reference_client.rs"
required-features = ["interop"]

# Our client's fragmentation, read frame by frame by the reference's own
# subscriber. Needs the reference build for the driver *and* for the sample.
[[test]]
name = "our_client_reference_frames"
path = "interop/our_client_reference_frames.rs"
required-features = ["interop"]

# The counter and error-log surfaces against the reference: our client's
# ADD_COUNTER/REMOVE_COUNTER on their driver, and both drivers' error entries
# read out by their ErrorStat and by our reader.
[[test]]
name = "counters_and_error_log"
path = "interop/counters_and_error_log.rs"
required-features = ["interop"]

# P1-4's acceptance: our driver and our client publish over UDP, and the
# reference's own subscriber — behind the reference's own driver — receives
# them. Two drivers, one wire.
[[test]]
name = "udp_transport"
path = "interop/udp_transport.rs"
required-features = ["interop"]

# A4: the reference's own `AeronStat` reading this driver's network counters,
# on a live UDP session.
[[test]]
name = "udp_counters"
path = "interop/udp_counters.rs"
required-features = ["interop"]

# The reference's own C client, compiled from `fixtures/destination_probe.c`,
# asking this driver to add a destination — nothing shipped exercises that API.
[[test]]
name = "destination_probe"
path = "interop/destination_probe.rs"
required-features = ["interop"]

# A padding frame that arrives as its own datagram: the reference's Ping and
# Pong, on a 64 KiB term, stop at the boundary when the receiver drops it.
[[test]]
name = "udp_padding_frame"
path = "interop/udp_padding_frame.rs"
required-features = ["interop"]

# A4 (receiving): a reference `BasicPublisher`, its messages read by our client
# through a subscription whose only address is a receive destination.
[[test]]
name = "multi_destination"
path = "interop/multi_destination.rs"
required-features = ["interop"]

# A7: a response subscription is served, and is not a reader — the same SETUP
# forms an image at an ordinary subscription and none at a response one.
[[test]]
name = "response_channel"
path = "interop/response_channel.rs"
required-features = ["interop"]

# A8: the reference's own `response_client` and `response_server`, run
# against a driver this build wrote. The only arrangement in which the nine-step
# handshake is decided by two programs that share no code with it.
[[test]]
name = "response_channel_reference"
path = "interop/response_channel_reference.rs"
required-features = ["interop"]

[lints]
workspace = true
