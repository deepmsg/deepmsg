[package]
name = "deepmsg-tests"
description = "Cross-crate integration and interop tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Tests that require the reference C driver from the Aeron 1.53.2 checkout
# (see docs/reference.md for the expected sibling-directory layout).
interop = []
# Tests in which *this* build's driver runs on the DPDK media, which is a
# feature of `deepmsg-driver` rather than of this crate: the pairing that has
# to be asserted is that the driver binary the harness spawns was built with it.
dpdk = ["deepmsg-driver/dpdk"]

[dependencies]
deepmsg-core = { path = "../crates/core" }
deepmsg-client = { path = "../crates/client" }
deepmsg-driver = { path = "../crates/driver" }
deepmsg-cnc = { path = "../crates/cnc" }
deepmsg-codec = { path = "../crates/codec" }
deepmsg-codec-cluster = { path = "../crates/codec/cluster" }
deepmsg-codec-cluster-mark = { path = "../crates/codec/cluster-mark" }
deepmsg-archive = { path = "../crates/archive" }
deepmsg-cluster = { path = "../crates/cluster/consensus" }
deepmsg-cluster-common = { path = "../crates/cluster/common" }
deepmsg-cluster-client = { path = "../crates/cluster/client" }
deepmsg-cluster-service = { path = "../crates/cluster/service" }

[[test]]
name = "basic_roundtrip"
path = "integration/basic_roundtrip.rs"

[[test]]
name = "cluster_cm_launch"
path = "integration/cluster_cm_launch.rs"

[[test]]
name = "cluster_session"
path = "integration/cluster_session.rs"

[[test]]
name = "cluster_service"
path = "integration/cluster_service.rs"

[[test]]
name = "cluster_snapshot"
path = "integration/cluster_snapshot.rs"

[[test]]
name = "cluster_control"
path = "integration/cluster_control.rs"

[[test]]
name = "cluster_three_nodes"
path = "integration/cluster_three_nodes.rs"

[[test]]
name = "cluster_follower_path"
path = "integration/cluster_follower_path.rs"

[[test]]
name = "forwarding_poll"
path = "integration/forwarding_poll.rs"

[[test]]
name = "termination_handshake"
path = "integration/termination_handshake.rs"

[[test]]
name = "loss_report"
path = "integration/loss_report.rs"

[[test]]
name = "loss_report_reference"
path = "interop/loss_report.rs"
required-features = ["interop"]

# T5: two media, one cable. Needs a device bound to vfio-pci and root, so it is
# `#[ignore]`d and run by hand on a machine that has one; it is listed here so
# that the `dpdk` job compiles it.
[[test]]
name = "dpdk_cross_media"
path = "interop/dpdk_cross_media.rs"
required-features = ["interop", "dpdk"]

[[test]]
name = "java_archive_id"
path = "interop/java_archive_id.rs"
required-features = ["interop"]

# A replication whose **source** is the reference's own archive: the pairing
# every other criterion in this slice leaves out, since they are our build on
# both ends.
[[test]]
name = "replication_reference_archive"
path = "interop/replication_reference_archive.rs"
required-features = ["interop"]

# The three recording events, decoded by the reference's own
# `RecordingEventsAdapter` — the reader they exist for, and the only one that
# can say the bytes are the schema's rather than ours.
[[test]]
name = "recording_events_reference"
path = "interop/recording_events_reference.rs"
required-features = ["interop"]

# ★ `B0′`: our archive attached to the reference's Java media driver, with the
# reference's own `AeronArchive` client as the instrument. The gate the
# archive-vs-Java benchmark's `R-attach` arm rests on.
[[test]]
name = "attached_to_the_reference_driver"
path = "interop/attached_to_the_reference_driver.rs"
required-features = ["interop"]

# Runs in CI, unlike `c_driver_basic`: it needs only a committed capture of a
# real driver's CnC header, not the reference checkout.
[[test]]
name = "cnc_fixture"
path = "integration/cnc_fixture.rs"

# The SBE goldens: the reference's own encoded bytes, read back by our decoders
# and re-encoded by our encoders. Needs `tests/fixtures/sbe/` and no checkout,
# so it runs in CI.
[[test]]
name = "sbe_golden"
path = "integration/sbe_golden.rs"

# The writer's side of the same contract `cnc_fixture` reads: a file this
# build creates, compared byte for byte with a real driver's.
[[test]]
name = "cnc_create"
path = "integration/cnc_create.rs"

# The termination preconditions, against synthetic CnC files. No driver needed,
# so unlike `c_driver_basic` this one runs in CI.
[[test]]
name = "cnc_terminate"
path = "integration/cnc_terminate.rs"

# The client's matching loop against fabricated replies. Runs in CI, which the
# interop suite cannot.
# A client giving a publication or a subscription back — the three ways it can,
# against a real driver of ours. Runs in CI.
# The port a subscription listened on coming back when it goes — the receive
# endpoint's lifecycle, from the outside. Runs in CI.
# A destination added to a manual subscription connecting the far end's
# publisher. Runs in CI.
[[test]]
name = "mds_added_destination"
path = "integration/mds_added_destination.rs"

[[test]]
name = "publication_links"
path = "integration/publication_links.rs"

[[test]]
name = "receive_endpoint_lifecycle"
path = "integration/receive_endpoint_lifecycle.rs"

[[test]]
name = "resource_lifecycle"
path = "integration/resource_lifecycle.rs"

# A channel whose name does not resolve is refused **by name**, on both sides.
# The reference's own case is `AsyncResourceTest.shouldDetectUnknownHost`, which
# only its Java driver can run; this one runs in CI.
[[test]]
name = "unresolved_endpoint"
path = "integration/unresolved_endpoint.rs"

[[test]]
name = "client_round_trip"
path = "integration/client_round_trip.rs"

# The wait a client owes a driver that is still creating its file — the window
# that made a client started alongside a driver fail deterministically.
# A UDP stream that crosses a term boundary, where the term's tail is a padding
# frame sent as its header alone. Runs in CI: it needs our own driver, not the
# reference's.
[[test]]
name = "udp_term_boundary"
path = "integration/udp_term_boundary.rs"

# A subscription that reads a local publication's log buffer without a socket.
# Runs in CI: it needs our own driver, not the reference's.
[[test]]
name = "spy_subscription"
path = "integration/spy_subscription.rs"

# An IPC publication added to a manual subscription as a source — the same third
# way a link is made, reading a buffer rather than a socket. Runs in CI.
[[test]]
name = "ipc_destination"
path = "integration/ipc_destination.rs"

# CUBIC on a live stream: the round trip an image measures, and the window it
# runs. Runs in CI.
[[test]]
name = "congestion_control"
path = "integration/congestion_control.rs"

# A publication with one producer, from our client to our driver over IPC.
# Runs in CI: it needs our own driver, not the reference's.
[[test]]
name = "exclusive_publication"
path = "integration/exclusive_publication.rs"

# What a client can see of its images: the arrival and departure events, the
# fragment-level poll, and the state an image reports. Runs in CI: it needs our
# own driver, not the reference's.
[[test]]
name = "image_lifecycle"
path = "integration/image_lifecycle.rs"

# The asynchronous adds, which write a command and answer later. Runs in CI: it
# needs our own driver, not the reference's.
[[test]]
name = "async_add"
path = "integration/async_add.rs"

# Claiming space in a shared publication and writing into it, which is the
# zero-copy path a concurrent producer needs. Runs in CI: it needs our own
# driver, not the reference's.
[[test]]
name = "claim_rotation"
path = "integration/claim_rotation.rs"

# The window a publication reports, in both directions: a reader that stops
# closes it until an offer is refused, and a reader that catches up opens it.
# Runs in CI: it needs our own driver, not the reference's.
[[test]]
name = "available_window"
path = "integration/available_window.rs"

[[test]]
name = "shared_claim"
path = "integration/shared_claim.rs"

# A `reliable=false` subscription on a lossy stream: it fills its holes instead
# of asking for them, so the messages lost on the wire are lost. Runs in CI: the
# loss comes from this driver's own seam, not from the reference's.
[[test]]
name = "unreliable_stream"
path = "integration/unreliable_stream.rs"

[[test]]
name = "connect_window"
path = "integration/connect_window.rs"

# What the directory discipline does with a CnC file whose version this build
# may not read: refuse it, never delete it.
[[test]]
name = "dir_liveness"
path = "integration/dir_liveness.rs"

# G0-1: the process contract the reference's own system tests assume —
# environment-variable configuration, an unknown name that must not stop the
# driver, an empty stderr on a clean run, and a `TERMINATE_DRIVER` written by a
# process that never registered. Needs our own driver binary, not the
# reference's, so it runs in CI.
[[test]]
name = "driver_process_contract"
path = "integration/driver_process_contract.rs"

# Rejecting an image, end to end through two clients and a real driver: the
# subscriber refuses the image it is reading and the *publisher's* client is
# the one told. Needs our own driver binary, so it runs in CI.
[[test]]
name = "reject_image"
path = "integration/reject_image.rs"

# GET_NEXT_AVAILABLE_SESSION_ID, end to end: the driver must not answer with a
# session id a publication on that stream already holds. Needs our own driver
# binary, so it runs in CI.
[[test]]
name = "next_session_id"
path = "integration/next_session_id.rs"

# P2-S1's acceptance: our archiving media driver, our client, and one connect
# the archive answers. The control plane's first end-to-end run. Needs our own
# archiving media driver binary, not the reference's, so it runs in CI — which
# is why it is here and not in `interop/`, where a `required-features` target
# would only ever be compiled.
[[test]]
name = "archive_connect"
path = "integration/archive_connect.rs"

# P2-9a: what `aeron.archive.threading.mode` puts on the process — the
# reference's agent names, read out of `/proc/<pid>/task` rather than reported
# by the process itself. Our own binaries only, so it runs in CI for the same
# reason the entry above does.
[[test]]
name = "archive_threading"
path = "integration/archive_threading.rs"

# P2-S7's acceptance in Rust, and the same criterion as the entry above: our two
# binaries and our client, with the one thing this slice adds — the archive is a
# process of its own, attached to a driver it does not own. The C suite's
# resilience binary is where the topology is really judged and needs the shim;
# this is the claim CI can run.
[[test]]
name = "standalone_archive"
path = "integration/standalone_archive.rs"

# P2-S2's acceptance, and the same criterion: our archiving media driver binary,
# our client, one recording made and stopped. The C suite is this slice's
# judgement and needs the reference checkout; this is the claim CI can run.
[[test]]
name = "archive_recording"
path = "integration/archive_recording.rs"

# P2-S4's acceptance, and the same criterion again: a recording, replayed, on
# the parts of a replay the C suite cannot see — the rewritten frame headers, a
# replay that crosses segment files, a short read block, and a bounded replay
# whose limit counter goes away.
[[test]]
name = "archive_replay"
path = "integration/archive_replay.rs"

# P2-S3's acceptance, and the same criterion again: two recordings, and the
# pages they are answered in — the cursor, the two ways a page ends, and the two
# filters. Needs our own archiving media driver binary, so it runs in CI.
[[test]]
name = "archive_queries"
path = "integration/archive_queries.rs"

# P2-C1's acceptance, first half: what an archive client's context is — the
# reference's own `AeronCArchiveIdTest` cases, ported value for value. No
# archive and no driver: a context is decided before anything is connected, so
# this runs in CI.
[[test]]
name = "archive_client"
path = "integration/archive_client.rs"

# P2-C1's request proxy: all thirty-two requests published for real and read
# back off the wire, which is the check that catches a field mix-up in an
# encoder that is otherwise one of thirty-two near-identical ones.
[[test]]
name = "archive_proxy"
path = "integration/archive_proxy.rs"

# P2-C1's control-response poller: the three templates it understands, the one
# message per poll it returns, and the templates it steps over.
[[test]]
name = "archive_poller"
path = "integration/archive_poller.rs"

# P2-C1's connect: the state machine driven against a real archive, and the two
# decisions it makes before anything is sent.
[[test]]
name = "archive_async_connect"
path = "integration/archive_async_connect.rs"

# P2-C1's `Archive`: the object, its four waits, and the recording signals that
# must not end one.
[[test]]
name = "archive_client_api"
path = "integration/archive_client_api.rs"

# P2-C4's async client: the self-healing one, its callbacks, and the reconnect
# that only a client which remakes its driver connection can survive. Needs our
# archiving media driver binary, so it runs in CI.
[[test]]
name = "archive_async_client"
path = "integration/archive_async_client.rs"

# P2-C4's persistent subscription, live half: the reference's
# `shouldReplayExistingRecordingThenJoinLive`, four of its twelve cells. Needs
# our archiving media driver binary, so it runs in CI.
[[test]]
name = "persistent_subscription_live"
path = "integration/persistent_subscription_live.rs"

# P2-C4's persistent subscription, the archive half of its self-healing: the
# archive is killed and restarted while a replay is in flight. Needs our
# archiving media driver binary, so it runs in CI.
[[test]]
name = "persistent_subscription_healing"
path = "integration/persistent_subscription_healing.rs"

# P2-C4's persistent subscription, replay half: a recording replayed into the
# application through the subscription's own poll. Needs our archiving media
# driver binary, so it runs in CI.
[[test]]
name = "persistent_subscription_replay"
path = "integration/persistent_subscription_replay.rs"

# P2-C4's counters: the four a persistent subscription publishes (114–117),
# read back out of the CnC file by type id the way the reference's own two
# cases read them. Needs our driver binary, so it runs in CI.
[[test]]
name = "persistent_subscription_counters"
path = "integration/persistent_subscription_counters.rs"

# P2-C4's closing family: what a close mid-replay gives back, judged by what can
# be done afterwards rather than by the absence of a crash. Needs our archiving
# media driver binary, so it runs in CI.
[[test]]
name = "persistent_subscription_close"
path = "integration/persistent_subscription_close.rs"

# P2-C4's timeouts: what a persistent subscription does when an answer never
# comes, judged by watching it ask again rather than by a poll's return value.
# Needs our archiving media driver binary, so it runs in CI.
[[test]]
name = "persistent_subscription_timeouts"
path = "integration/persistent_subscription_timeouts.rs"

# P2-C4's alignment, at last: the replay slowed by injected loss while the live
# stream runs ahead, so `ATTEMPT_SWITCH` has to align two positions that do not
# agree. Needs our archiving media driver binary, so it runs in CI.
[[test]]
name = "persistent_subscription_loss"
path = "integration/persistent_subscription_loss.rs"

# P2-C4's receive-side loss injection: the driver's own `debug.receive.data.loss`
# rules, judged by what a subscriber is and is not handed. Needs our driver
# binary, so it runs in CI.
[[test]]
name = "receive_loss_injection"
path = "integration/receive_loss_injection.rs"

# P2-C4's response-channel replay: the channel the replay comes back on, and
# what a replay over a `control-mode=response` channel has to do first — a
# publication of the client's own, a proxy over it, and a replay token. Needs
# our archiving media driver binary, so it runs in CI.
[[test]]
name = "persistent_subscription_configured_channel"
path = "integration/persistent_subscription_configured_channel.rs"

# P2-S5's acceptance, and the same criterion again: the segment operations, on
# the four things the C suite cannot see — the bytes a truncate leaves in the
# segment file it cut, a delete that has to wait for a replay, a replay refused
# while a delete is in flight, and a delete that finishes one something else
# half-rolled. Needs our own archiving media driver binary, so it runs in CI.
[[test]]
name = "archive_segments"
path = "integration/archive_segments.rs"

# Our client's REJECT_IMAGE against the reference driver: whether the record
# this build writes is one the reference reads, and whether its
# ON_PUBLICATION_ERROR is one this build reads. Needs the reference checkout.
[[test]]
name = "our_client_rejects_on_the_reference_driver"
path = "interop/our_client_rejects_on_the_reference_driver.rs"
required-features = ["interop"]

[[test]]
name = "c_driver_basic"
path = "interop/c_driver_basic.rs"
required-features = ["interop"]

# The two-sided termination oracle: refused by default, accepted when the
# driver is started with an allowing validator.
[[test]]
name = "c_driver_terminate"
path = "interop/c_driver_terminate.rs"
required-features = ["interop"]

# The command/response loop: add a subscription, match its ready response, and
# prove the keepalive keeps the client alive.
[[test]]
name = "c_driver_client"
path = "interop/c_driver_client.rs"
required-features = ["interop"]

# P0's acceptance test: an IPC payload written by one client and read by
# another, through a log buffer the driver created and both processes mapped.
[[test]]
name = "c_driver_pubsub"
path = "interop/c_driver_pubsub.rs"
required-features = ["interop"]

# The other direction: the reference's own counter viewer reading a file
# *this* build wrote. Needs the reference build for `AeronStat`, not for a
# driver.
# The mark file, both ways round: the reference's own `ArchiveTool` reading a
# mark file this build wrote, and both readers on the same golden. Needs the
# reference's `aeron-all` jar, not a driver.
# The catalog, read by the reference's own `ArchiveTool`: `count-entries`,
# `capacity` and `describe-all` on an archive directory this build wrote, and
# both readers on the golden. Needs the reference's `aeron-all` jar.
# Segments and recovery against the reference's own tools: `ArchiveTool checksum`
# on what this build wrote, and `RecoverCatalog` — a probe, because the reference
# repairs inside its catalog constructor — on the same directory.
[[test]]
name = "segment_reference"
path = "interop/segment_reference.rs"
required-features = ["interop"]

[[test]]
name = "catalog_reference"
path = "interop/catalog_reference.rs"
required-features = ["interop"]

[[test]]
name = "mark_file_reference"
path = "interop/mark_file_reference.rs"
required-features = ["interop"]

[[test]]
name = "aeron_stat_counters"
path = "interop/aeron_stat_counters.rs"
required-features = ["interop"]

# The other direction of the pair above: the reference's own client samples
# against a driver *this* build wrote. Needs the reference build for the
# samples, and our own driver binary for the driver.
[[test]]
name = "own_driver_reference_client"
path = "interop/own_driver_reference_client.rs"
required-features = ["interop"]

# Our client's fragmentation, read frame by frame by the reference's own
# subscriber. Needs the reference build for the driver *and* for the sample.
[[test]]
name = "our_client_reference_frames"
path = "interop/our_client_reference_frames.rs"
required-features = ["interop"]

# The counter and error-log surfaces against the reference: our client's
# ADD_COUNTER/REMOVE_COUNTER on their driver, and both drivers' error entries
# read out by their ErrorStat and by our reader.
[[test]]
name = "counters_and_error_log"
path = "interop/counters_and_error_log.rs"
required-features = ["interop"]

# G3-8b: the entry both drivers record for a sender MTU the window cannot carry.
[[test]]
name = "mtu_fault_entry"
path = "interop/mtu_fault_entry.rs"
required-features = ["interop"]

# G3-8b: the five-line chain both drivers answer and record for a failed bind.
[[test]]
name = "bind_fault_entry"
path = "interop/bind_fault_entry.rs"
required-features = ["interop"]

# P1-4's acceptance: our driver and our client publish over UDP, and the
# reference's own subscriber — behind the reference's own driver — receives
# them. Two drivers, one wire.
[[test]]
name = "udp_transport"
path = "interop/udp_transport.rs"
required-features = ["interop"]

# A4: the reference's own `AeronStat` reading this driver's network counters,
# on a live UDP session.
[[test]]
name = "udp_counters"
path = "interop/udp_counters.rs"
required-features = ["interop"]

# The reference's own C client, compiled from `fixtures/destination_probe.c`,
# asking this driver to add a destination — nothing shipped exercises that API.
[[test]]
name = "destination_probe"
path = "interop/destination_probe.rs"
required-features = ["interop"]

# A channel the reference's C driver refuses and this one serves: the two
# verdicts of one divergence, read from the same place.
[[test]]
name = "null_tag_channel"
path = "interop/null_tag_channel.rs"
required-features = ["interop"]

# A padding frame that arrives as its own datagram: the reference's Ping and
# Pong, on a 64 KiB term, stop at the boundary when the receiver drops it.
[[test]]
name = "udp_padding_frame"
path = "interop/udp_padding_frame.rs"
required-features = ["interop"]

# The reference's own C client, compiled from `fixtures/spy_probe.c`, reading a
# local publication through `aeron-spy:` — no shipped sample uses the scheme.
[[test]]
name = "spy_reference"
path = "interop/spy_reference.rs"
required-features = ["interop"]

# A4 (receiving): a reference `BasicPublisher`, its messages read by our client
# through a subscription whose only address is a receive destination.
[[test]]
name = "multi_destination"
path = "interop/multi_destination.rs"
required-features = ["interop"]

# A7: a response subscription is served, and is not a reader — the same SETUP
# forms an image at an ordinary subscription and none at a response one.
[[test]]
name = "response_channel"
path = "interop/response_channel.rs"
required-features = ["interop"]

# A8: the reference's own `response_client` and `response_server`, run
# against a driver this build wrote. The only arrangement in which the nine-step
# handshake is decided by two programs that share no code with it.
[[test]]
name = "response_channel_reference"
path = "interop/response_channel_reference.rs"
required-features = ["interop"]

# Q3: our `driver` name resolver and a reference `aeronmd`'s see each other.
# The one arrangement in which the RES datagram's dialect is decided by two
# drivers that share no code, which is the whole of the "can replace the
# driver" criterion for name resolution.
[[test]]
name = "resolver_gossip"
path = "interop/resolver_gossip.rs"
required-features = ["interop"]

# P2-1c: one reference client, one question, two drivers. The client library
# rewrites the request channel to name the response subscription when the
# response channel is a response channel (`AeronArchive.java:4043-4048`), so the
# reading is the *difference* between the same probe under each driver.
[[test]]
name = "ipc_response_channel_probe"
path = "interop/ipc_response_channel_probe.rs"
required-features = ["interop"]

# P2-1c, one level up: a real archive in the probe's own process, a real client,
# and one connect over IPC. The driver on its own was measured and is not where
# the archive's red is; this is the case with the archive put back.
[[test]]
name = "archive_connect_over_ipc"
path = "interop/archive_connect_over_ipc.rs"
required-features = ["interop"]

# The conductor's own clock while the agent is busy: the property
# `AsyncResourceTest.shouldDetectUnknownHost` is about, pinned without asking a
# nameserver anything.
[[test]]
name = "heartbeat_while_parsing"
path = "integration/heartbeat.rs"

[lints]
workspace = true

[[test]]
name = "archive_replay_merge"
path = "integration/archive_replay_merge.rs"

# A datagram the receiver cannot read as a frame is an invalid packet: the
# reference counts one too short to hold a header, and this build dropped it
# without a counter.
[[test]]
name = "short_datagram"
path = "integration/short_datagram.rs"

# The receiver's buffers are `AERON_DRIVER_RECEIVER_MAX_UDP_PACKET_LENGTH`, not
# the driver's default MTU: a publication may name a larger `mtu=` of its own
# (P3-6b's second arm restarts a cluster on `mtu=8992`), and a buffer sized
# from the default drops every datagram that large without an error.
[[test]]
name = "udp_receive_mtu"
path = "integration/udp_receive_mtu.rs"

# P3-4f's LC-4b: our consensus module, the reference's own service container
# (a Java `ClusteredService` from the fork's `deepmsg-tests/java/`) and the
# reference's own `AeronCluster` client. Needs the reference jar, a JDK, our
# cluster-node binary and our archiving media driver binary.
[[test]]
name = "cluster_lc4b"
path = "interop/cluster_lc4b.rs"
required-features = ["interop"]

# P3-3a's LC-1 first step: our cluster client connecting to the reference's
# single Java node over IPC.
[[test]]
name = "cluster_lc1_connect"
path = "interop/cluster_lc1_connect.rs"
required-features = ["interop"]

# P3-2a's LC-4a smoke: the reference's driver, archive and consensus module in
# one Java process, deepmsg's service container against them, and the
# reference's own `AeronCluster` client. Needs the reference jar, a JDK and the
# fork's Java probes.
[[test]]
name = "cluster_lc4a_smoke"
path = "interop/cluster_lc4a_smoke.rs"
required-features = ["interop"]

# P3-2c: a client message offered back through a service message comes back
# once. Needs the reference jar and the fork's Java probes.
[[test]]
name = "cluster_lc4a_service_messages"
path = "interop/cluster_lc4a_service_messages.rs"
required-features = ["interop"]

# P3-2c: two containers on one node both answer every message. Needs the
# reference jar and the fork's Java probes.
[[test]]
name = "cluster_lc4a_multi_service"
path = "interop/cluster_lc4a_multi_service.rs"
required-features = ["interop"]

# P3-2c: three nodes elect, and a new leader serves after the old one stops.
[[test]]
name = "cluster_lc4a_failover"
path = "interop/cluster_lc4a_failover.rs"
required-features = ["interop"]

# P3-2c: session open, close and timeout, read through the test business.
[[test]]
name = "cluster_lc4a_sessions"
path = "interop/cluster_lc4a_sessions.rs"
required-features = ["interop"]

# P3-2c: a business whose snapshot throws ends its container and the cluster
# carries on.
[[test]]
name = "cluster_lc4a_snapshot_failure"
path = "interop/cluster_lc4a_snapshot_failure.rs"
required-features = ["interop"]

# P3-2b: the snapshot is taken, survives a restart, and is byte-identical to the
# Java twin's. Needs the reference jar and the fork's Java probes.
[[test]]
name = "cluster_lc4a_snapshot"
path = "interop/cluster_lc4a_snapshot.rs"
required-features = ["interop"]
